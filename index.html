<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --text:#eef0f3; --muted:#9aa3b2; --accent:#7c5cff;
  --border:#2a2f3a; --bubble-me:#7c5cff; --bubble-other:#232834;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f5f6f8; --panel:#fff; --text:#141822; --muted:#6b7280; --border:#e3e5ea; --bubble-other:#eceef2; }
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
body{ display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
header{ padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; }
#messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.msg{ max-width:75%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4; }
.msg .name{ font-size:11px; opacity:.7; margin-bottom:2px; font-weight:600; }
.me{ align-self:flex-end; background:var(--bubble-me); color:#fff; border-bottom-right-radius:4px; }
.other{ align-self:flex-start; background:var(--bubble-other); color:var(--text); border-bottom-left-radius:4px; }
.empty{ text-align:center; color:var(--muted); font-size:13px; margin-top:40px; }
form{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); background:var(--panel); }
input[type=text]{ flex:1; padding:11px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; }
button{ background:var(--accent); color:#fff; border:none; border-radius:20px; padding:0 18px; font-size:14px; cursor:pointer; }
#nameModal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
.hidden{ display:none !important; }
.card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; width:100%; max-width:320px; }
.card h2{ margin:0 0 6px; font-size:17px; }
.card p{ color:var(--muted); font-size:13px; margin:0 0 14px; }
.card input{ width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; margin-bottom:12px; }
.card button{ width:100%; padding:11px; border-radius:10px; }
</style>
</head>
<body>

<div id="nameModal">
  <div class="card">
    <h2>Как тебя зовут?</h2>
    <p>Имя будет видно другим в чате</p>
    <input id="nameInput" type="text" placeholder="Твоё имя" maxlength="24">
    <button onclick="saveName()">Войти в чат</button>
  </div>
</div>

<header>💬 Общий чат</header>
<div id="messages"><div class="empty">Сообщений пока нет — напиши первым</div></div>
<form id="sendForm" onsubmit="sendMessage(event)">
  <input id="textInput" type="text" placeholder="Сообщение…" autocomplete="off">
  <button type="submit">Отправить</button>
</form>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTSwocaEXXl5-5kLX0UvPoqzj2owZqwf0",
  authDomain: "smayter.firebaseapp.com",
  projectId: "smayter",
  storageBucket: "smayter.firebasestorage.app",
  messagingSenderId: "796403075271",
  appId: "1:796403075271:web:6498b0f7144451c91596e2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
let myName = localStorage.getItem('chatName');

function saveName(){
  const v = $('nameInput').value.trim();
  if(!v){ return; }
  myName = v;
  localStorage.setItem('chatName', v);
  $('nameModal').classList.add('hidden');
}
if(myName){ $('nameModal').classList.add('hidden'); }

function sendMessage(e){
  e.preventDefault();
  const text = $('textInput').value.trim();
  if(!text || !myName) return;
  $('textInput').value = '';
  db.collection('messages').add({
    name: myName,
    text: text,
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

db.collection('messages').orderBy('ts').limitToLast(50)
  .onSnapshot(snap => {
    const box = $('messages');
    box.innerHTML = '';
    if(snap.empty){ box.innerHTML = '<div class="empty">Сообщений пока нет — напиши первым</div>'; return; }
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.name === myName ? 'me' : 'other');
      div.innerHTML = '<div class="name">'+escapeHtml(m.name||'...')+'</div>'+escapeHtml(m.text||'');
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }, err => {
    $('messages').innerHTML = '<div class="empty">Ошибка подключения к базе: '+err.message+'</div>';
  });

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
