<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveDemo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --text:#eef0f3; --muted:#9aa3b2; --accent:#7c5cff;
  --border:#2a2f3a; --danger:#ff5c5c;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f5f6f8; --panel:#fff; --text:#141822; --muted:#6b7280; --border:#e3e5ea; }
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
.screen{ padding:16px; padding-bottom:96px; max-width:560px; margin:0 auto; }
.hidden{ display:none !important; }
h1{ font-size:20px; margin:4px 0 2px; }
.sub{ color:var(--muted); font-size:13px; margin-bottom:18px; }
.card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:15px; margin-bottom:10px; }
button{ background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 16px; font-size:14px; cursor:pointer; }
.stopbtn{ background:var(--danger); }
video{ width:100%; border-radius:12px; background:#000; display:block; margin-bottom:10px; }
.code{ font-size:28px; font-weight:700; letter-spacing:2px; text-align:center; padding:14px; background:var(--bg); border-radius:10px; margin:10px 0; }
.status{ font-size:13px; color:var(--muted); }
nav{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--border);
  padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:space-around; align-items:center; }
.navbtn{ background:none; border:none; color:var(--muted); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.navbtn.active{ color:var(--text); }
.plusbtn{ width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:26px; margin-top:-26px; box-shadow:0 4px 14px rgba(124,92,255,.5); }
</style>
</head>
<body>

<div id="homeScreen" class="screen">
  <h1>📡 LiveDemo</h1>
  <div class="sub">Настоящий P2P-стриминг прямо из браузера (без сервера видео).</div>
  <div class="card">
    <b>Смотреть трансляцию</b>
    <div class="sub">Введи код, который тебе прислал стример</div>
    <input id="codeInput" placeholder="Например: ABC123" autocapitalize="characters">
    <button onclick="joinByCode()">Смотреть</button>
  </div>
</div>

<div id="streamerScreen" class="screen hidden">
  <h1>Ты в эфире</h1>
  <video id="localVideo" autoplay muted playsinline></video>
  <div class="card">
    <div class="sub">Код трансляции (отправь зрителям):</div>
    <div class="code" id="codeDisplay">—</div>
    <button onclick="copyLink()">Скопировать ссылку</button>
    <div class="status" id="streamerStatus" style="margin-top:10px">Ожидание подключения…</div>
  </div>
  <button class="stopbtn" onclick="stopStreaming()">Завершить трансляцию</button>
</div>

<div id="viewerScreen" class="screen hidden">
  <h1>Просмотр</h1>
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="status" id="viewerStatus">Подключаюсь…</div>
</div>

<nav>
  <button class="navbtn active" id="navHome" onclick="goHome()"><span style="font-size:20px">🏠</span>Главная</button>
  <button class="plusbtn" onclick="goLive()">+</button>
  <button class="navbtn" style="visibility:hidden"><span>·</span>·</button>
</nav>

<script>
let peer=null, localStream=null, viewerCount=0;
const activeCalls = [];
const $=id=>document.getElementById(id);

function showScreen(name){
  ['homeScreen','streamerScreen','viewerScreen'].forEach(s=>$(s).classList.toggle('hidden', s!==name));
  $('navHome').classList.toggle('active', name==='homeScreen');
}
function goHome(){
  showScreen('homeScreen');
}

function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

async function goLive(){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  }catch(e){ alert('Нет доступа к камере: '+e.message); return; }
  $('localVideo').srcObject = localStream;
  showScreen('streamerScreen');
  const code = randomCode();
  if(peer) peer.destroy();
  peer = new Peer(code);
  peer.on('open', id => { $('codeDisplay').textContent = id; });
  peer.on('error', err => { $('streamerStatus').textContent = 'Ошибка: '+err.type+' — попробуй ещё раз'; });
  peer.on('call', call => {
    call.answer(localStream);
    activeCalls.push(call);
    viewerCount++;
    $('streamerStatus').textContent = 'Зрителей: '+viewerCount;
    call.on('close', ()=>{ viewerCount=Math.max(0,viewerCount-1); $('streamerStatus').textContent='Зрителей: '+viewerCount; });
  });
}

function stopStreaming(){
  activeCalls.forEach(c=>c.close());
  activeCalls.length=0;
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(peer) peer.destroy();
  viewerCount=0;
  goHome();
}

function copyLink(){
  const code = $('codeDisplay').textContent;
  const url = location.origin + location.pathname + '?watch=' + code;
  navigator.clipboard.writeText(url).then(()=>alert('Ссылка скопирована:\n'+url));
}

function joinByCode(){
  const code = $('codeInput').value.trim().toUpperCase();
  if(!code){ alert('Введи код трансляции'); return; }
  connectToStream(code);
}

function connectToStream(code){
  showScreen('viewerScreen');
  $('viewerStatus').textContent = 'Подключаюсь к '+code+'…';
  if(peer) peer.destroy();
  peer = new Peer();
  peer.on('open', () => {
    const call = peer.call(code, new MediaStream());
    call.on('stream', remoteStream => {
      $('remoteVideo').srcObject = remoteStream;
      $('viewerStatus').textContent = 'В эфире ✅';
    });
    call.on('error', e => { $('viewerStatus').textContent = 'Ошибка соединения: '+e; });
    call.on('close', () => { $('viewerStatus').textContent = 'Трансляция завершена'; });
  });
  peer.on('error', err => { $('viewerStatus').textContent = 'Не удалось найти трансляцию ('+err.type+'). Проверь код.'; });
}

// авто-подключение по ссылке ?watch=CODE
const params = new URLSearchParams(location.search);
const watchCode = params.get('watch');
if(watchCode) connectToStream(watchCode.toUpperCase());
</script>
</body>
</html>
